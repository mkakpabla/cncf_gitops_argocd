# Valeurs globales
namespace: event-map
serverIp: "68.183.132.93"   # Surcharger via --set serverIp=1.2.3.4

# ──────────────────────────────────────────
# MongoDB
# ──────────────────────────────────────────
mongodb:
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  auth:
    username: user
    # Surcharger via --set mongodb.auth.password=<secret> ou un Secret externe
    password: changeme
    database: eventmap
  storage:
    size: 2Gi
    storageClassName: "local-path"   # storageClass assignée par le cluster
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 27017

# ──────────────────────────────────────────
# API (FastAPI / uvicorn)
# ──────────────────────────────────────────
api:
  image:
    repository: ghcr.io/mia/event-map-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 9000
  env:
    MONGO_DB: eventmap
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 9000
  ingress:
    enabled: true
    path: /

# ──────────────────────────────────────────
# Frontend (React / Vite)
# ──────────────────────────────────────────
front:
  image:
    repository: ghcr.io/mkakpabla/event-map-front
    tag: e016432
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 4173
  env:
    VITE_API_URL: ""   # Construit automatiquement depuis serverIp
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 4173
  ingress:
    enabled: true
    path: /
