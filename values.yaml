# Valeurs globales
namespace: event-map
serverHost: "change-me"

# ──────────────────────────────────────────
# cert-manager / Let's Encrypt
# ──────────────────────────────────────────
certManager:
  enabled: true
  email: mk.akpabla@gmail.com
  clusterIssuer: letsencrypt-prod
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  installCRDs: true

# ──────────────────────────────────────────
# MongoDB
# ──────────────────────────────────────────
mongodb:
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  auth:
    username: user
    password: changeme
    database: eventmap
  storage:
    size: 2Gi
    storageClassName: "local-path"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 27017

# ──────────────────────────────────────────
# API
# ──────────────────────────────────────────
api:
  replicaCount: 1
  port: 9000
  env:
    MONGO_DB: eventmap
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 9000
  ingress:
    enabled: true
    path: /
    host: "change-me"

# ──────────────────────────────────────────
# Frontend
# ──────────────────────────────────────────
front:
  replicaCount: 1
  port: 4173
  env:
    VITE_API_URL: {{ .Values.api.ingress.host | quote }}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 4173
  ingress:
    enabled: true
    path: /
    host: "change-me"
